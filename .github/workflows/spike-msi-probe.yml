name: MSI probe

# Пробная сборка для изменения user-logon-autostart (задачи 1.5 и 1.6).
# Приложение не собирается: проверяется только то, на чём держится план.
# Сценарии с Restart Manager идут на отдельных раннерах: код 3010
# оставил бы отложенную замену файлов, и следующий шаг проверял бы её.
on:
  push:
    branches: [ 'spike/msi-probe' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e .[build]

    - name: Install WiX
      run: |
        dotnet tool restore
        dotnet tool run wix extension add -g WixToolset.Util.wixext/5.0.2
        dotnet tool run wix --version

    - name: Build message DLL
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        New-Item -ItemType Directory -Force build\msg | Out-Null
        Copy-Item spike\version.rc build\msg\version.rc
        cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && mc -U -h build\msg -r build\msg spike\probe.mc && rc /nologo /fo build\msg\probe.res build\msg\version.rc && link /nologo /DLL /NOENTRY /MACHINE:X64 /OUT:build\msg\FilePickerProbe.messages.dll build\msg\probe.res"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    - name: Build probe with Nuitka
      env:
        PYTHONPATH: spike
      run: |
        python -m nuitka `
          --mode=standalone `
          --msvc=latest `
          --assume-yes-for-downloads `
          --remove-output `
          --output-dir=build `
          --output-folder-name=probe `
          --output-filename=probe.exe `
          --include-package=probe_pkg `
          --include-module=win32timezone `
          --windows-console-mode=attach `
          --product-name=FilePickerProbe `
          --file-description="File Picker probe" `
          --file-version=1.0.0 `
          --product-version=1.0.0 `
          --report=build\nuitka-report.xml `
          spike/probe_pkg/__main__.py
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Get-ChildItem build\probe.dist | Select-Object Name, Length

    # a — версия 1.0.0, b — следующая версия, c — та же версия, что у a,
    # но другой exe: так отличается сборка другого филиала
    - name: Make copies before signing
      run: |
        New-Item -ItemType Directory -Force build\pkg | Out-Null
        foreach ($name in 'a', 'b', 'c') {
          Copy-Item -Recurse build\probe.dist "build\pkg\$name"
          Copy-Item build\msg\FilePickerProbe.messages.dll "build\pkg\$name\"
        }
        python spike\patch_resources.py build\pkg\b\probe.exe --version 1.0.1
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python spike\patch_resources.py build\pkg\b\FilePickerProbe.messages.dll --version 1.0.1
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python spike\patch_resources.py build\pkg\c\probe.exe --marker 5100
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

    - name: Sign copies with a throwaway certificate
      shell: pwsh
      env:
        TIMESTAMP_URL: http://timestamp.digicert.com
        SIGN_PATH: build/pkg
      run: |
        $rsa = [System.Security.Cryptography.RSA]::Create(3072)
        $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
          'CN=FilePickerAPI CI probe', $rsa, 'SHA256',
          [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
        $eku = [System.Security.Cryptography.OidCollection]::new()
        [void]$eku.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3'))
        $request.CertificateExtensions.Add(
          [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($eku, $false))
        $request.CertificateExtensions.Add(
          [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new('DigitalSignature', $true))
        $cert = $request.CreateSelfSigned([DateTimeOffset]::UtcNow.AddDays(-1), [DateTimeOffset]::UtcNow.AddDays(1))
        $env:CERT_PASSWORD = [guid]::NewGuid().ToString()
        $env:CERT_PFX_BASE64 = [Convert]::ToBase64String($cert.Export('Pfx', $env:CERT_PASSWORD))
        ./.github/scripts/sign.ps1

    - name: Build MSI packages
      run: |
        function Build($name, $version, $branch) {
          dotnet tool run wix build spike\probe.wxs -arch x64 -ext WixToolset.Util.wixext `
            -d "Version=$version" -d "Branch=$branch" -bindpath "dist=build\pkg\$name" `
            -o "build\pkg\probe-$name.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
        Build a 1.0.0 5400
        Build b 1.0.1 5400
        Build c 1.0.0 5100
        Remove-Item build\pkg\*.wixpdb -ErrorAction SilentlyContinue
        Get-ChildItem build\pkg\*.msi | Select-Object Name, Length

    - name: Upload packages
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: probe-packages
        path: |
          build/pkg/
          build/nuitka-report.xml
        retention-days: 14

  probe:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [ basic, rm-admin, rm-system, rm-other-user, crash ]
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install pywin32
      run: pip install pywin32==312

    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: probe-packages
        path: packages/

    - name: Run scenario
      shell: pwsh
      run: ./spike/msi-probe.ps1 -Scenario ${{ matrix.scenario }} -Packages packages\pkg -ResultsDir results

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: results-${{ matrix.scenario }}
        path: results/
        retention-days: 14
